# Production stack — server (distroless static Go binary) + client (nginx
# SPA) built from the LOCAL prod Dockerfiles, plus the datastores on an
# internal network. Deliberately simpler than the fastapi per-release
# machinery: one plain compose, no blue/green colors, no platform project,
# no external volumes machinery, no registry images. Datastores publish NO
# host ports (family prod stance) — the app tier reaches them by service
# name; the only published ports are the server API (8100) and the client
# nginx front door (8101).
#
# server/ and client/ code arrive in Phases 0.B/0.C — until then this file
# validates (compose config) but does not build; that is the recorded plan,
# not a defect.
name: go_developers_guide_prod

services:
  server:
    build:
      context: ./../
      dockerfile: ./.docker/server/Dockerfile.prod
    image: gdg_server_prod
    container_name: go_developers_guide_server_prod
    restart: unless-stopped
    ports:
      - 8100:8100
    # The GDG_* env rails (env_file + fail-fast required-variable secrets,
    # fastapi-family style) arrive with the server's env config layer in
    # Phase 0.B; there is nothing to wire yet at 0.A.
    networks:
      - app_internal

  client:
    build:
      context: ./../
      dockerfile: ./.docker/client/Dockerfile.prod
    image: gdg_client_prod
    container_name: go_developers_guide_client_prod
    restart: unless-stopped
    ports:
      - 8101:80
    networks:
      - app_internal
    depends_on:
      # Start-order only for now; upgrades to `condition: service_healthy`
      # at 0.B when the server gains a distroless-safe health probe.
      - server
    healthcheck:
      # Prove the app tier answers, independent of the API gate.
      # nginx:1.27-alpine ships busybox wget.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Same datastore trio as the dev stack, project-scoped volumes, NO
  # published ports — prod datastores are reachable only inside the
  # app_internal network (family prod stance).
  postgres:
    image: postgres:17
    container_name: go_developers_guide_postgres_prod
    restart: unless-stopped
    environment:
      # Prod refuses the dev-grade password once the env rails exist (0.B);
      # wired then.
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=guide
      - POSTGRES_DB=guide
    volumes:
      - gdg-pg-data-prod:/var/lib/postgresql/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guide"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: go_developers_guide_redis_prod
    restart: unless-stopped
    volumes:
      - gdg-redis-data-prod:/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mongo:
    image: mongo:8
    container_name: go_developers_guide_mongo_prod
    restart: unless-stopped
    volumes:
      - gdg-mongo-data-prod:/data/db
    networks:
      - app_internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gdg-pg-data-prod:
  gdg-redis-data-prod:
  gdg-mongo-data-prod:

networks:
  # Plain project-scoped network: nginx's `proxy_pass http://server:8100`
  # and the app tier's datastore URLs resolve here.
  app_internal: {}
