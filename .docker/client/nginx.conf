server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API calls to the Go server (compose service name, port 8100).
    # Upgrade headers keep the realtime topics' WebSockets alive through
    # the proxy.
    location /api/ {
        proxy_pass http://server:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Hashed static assets (Vite emits content-hashed filenames under
    # /assets/) — the hash IS the cache key, so cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback: unknown paths serve the app, which renders the 404 view.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so deploys are picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
