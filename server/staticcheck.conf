# staticcheck configuration for the guide server.
#
# Pinned binary: honnef.co/go/tools/cmd/staticcheck@v0.8.2 (reports itself as
# "staticcheck 2026.2.2"), installed into the dev container's /go/bin:
#   go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
# Run from server/:  staticcheck ./...
#
# S1016 ("should convert T1 to T2 instead of using struct literal") is OFF for
# this tree, and only that check: the demos map row structs to wire-view
# structs field-by-field deliberately — the explicit mapping is the teaching
# pattern that shows which fact lands in which JSON field — and the flagged
# row→view sites sit inside snippet-quoted files where a mechanical rewrite
# to type conversions would break the source-of-truth ratchet. Every other
# check runs at staticcheck's default set ("inherited"); findings there are
# treated as real defects, not noise.
checks = ["inherited", "-S1016"]
